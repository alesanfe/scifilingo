name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff==0.15.22

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py check

      - name: Run deploy checks
        env:
          SECRET_KEY: ci-test-secret-key-with-50-chars-or-more-for-deploy-check
          RENDER: 'true'
          RENDER_EXTERNAL_HOSTNAME: test.onrender.com
        run: python manage.py check --deploy

      - name: Check migrations consistency
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py collectstatic --noinput

      - name: Run tests with pytest
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -v

  # Job that uses the Makefile to verify all make targets work
  makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install make (if not available)
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install dependencies via Makefile
        run: make install-dev

      - name: Run system checks via Makefile
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: make check

      - name: Run migrations via Makefile
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: make migrate

      - name: Run tests via Makefile
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: make test

      - name: Run linter via Makefile
        run: make lint

  # Deploy to Render only on main branch, after all CI checks pass
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, makefile]
    if: github.ref == 'refs/heads/main' && github.repository == 'alesanfe/scifilingo'

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy."
            echo "To enable auto-deploy, add it in:"
            echo "  GitHub repo > Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "Triggering Render deploy hook..."
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL" -H "Accept: application/json"
          echo "Deploy triggered. Check progress at https://dashboard.render.com"
