name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff==0.15.22

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py check

      - name: Run deploy checks
        env:
          # 50+ char key without django-insecure- prefix to pass W009
          SECRET_KEY: ci-test-secret-key-with-50-chars-or-more-for-deploy-check
          RENDER: 'true'
          RENDER_EXTERNAL_HOSTNAME: test.onrender.com
        run: python manage.py check --deploy

      - name: Check migrations consistency
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py collectstatic --noinput

      - name: Run tests with pytest
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -v
