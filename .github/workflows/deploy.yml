name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI checks would pass on the same branch
    needs: []
    if: github.repository == 'alesanfe/scifilingo'

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy."
            exit 1
          fi
          echo "Triggering Render deploy hook..."
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL" -H "Accept: application/json"
