{% extends "base.html" %}
{% load i18n %}
{% block title %}500 &middot; SciFiLingo{% endblock %}
{% block content %}
    <div class="flex flex-col items-center justify-center text-center py-20">
        <h1 class="text-8xl font-extrabold text-red-400 tracking-tight">500</h1>
        <h2 class="text-2xl font-bold text-white mt-4">{% trans "Server Error" %}</h2>
        <p class="text-gray-500 mt-2 mb-6">{% trans "Something went wrong on our end. Please try again later." %}</p>
        <a href="{% url 'home' %}"
           class="px-5 py-2.5 text-sm font-semibold bg-scifi-accent text-scifi-bg rounded-xl hover:bg-scifi-accent/90 transition-all">
            {% trans "Go Home" %}
        </a>
    </div>
{% endblock %}
