{% extends "base.html" %}

{% block title %}SciFiLingo - Fictional Language Translator{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <h2 class="mb-4">Fictional Language Translator</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="text_to_translate">Text to translate:</label>
                <textarea class="form-control" id="text_to_translate" name="text_to_translate" rows="4" required placeholder="Type your text here..."></textarea>
            </div>
            <div class="form-group">
                <label for="target_language">Target language:</label>
                <select class="form-control" id="target_language" name="target_language" required>
                    {% for slug, label in languages %}
                        <option value="{{ slug }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Translate</button>
        </form>
    </div>
</div>
{% endblock %}
