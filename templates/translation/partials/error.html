<div id="translation-error" class="mt-4 animate-slide-up">
    <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-start gap-3">
        <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <div class="flex-1">
            <p class="text-sm text-red-300 font-medium">Translation failed</p>
            <p class="text-sm text-red-400/80 mt-0.5">{{ error_message }}</p>
        </div>
        <button onclick="this.parentElement.parentElement.remove()" class="text-red-400/60 hover:text-red-400 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
</div>
