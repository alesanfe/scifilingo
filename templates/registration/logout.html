{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Logout" %} &middot; SciFiLingo{% endblock %}
{% block content %}
    <div class="flex justify-center pt-8">
        <div class="w-full max-w-md">
            <div class="bg-scifi-card border border-scifi-border rounded-2xl shadow-2xl shadow-black/40 p-8 animate-slide-up">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center">
                        <svg class="w-8 h-8 text-red-400"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-white">{% trans "Logout" %}</h1>
                    <p class="text-sm text-gray-500 mt-1">{% trans "Are you sure you want to log out?" %}</p>
                </div>
                <form method="post" class="space-y-3">
                    {% csrf_token %}
                    <button type="submit"
                            class="w-full py-3 px-4 bg-red-500/90 text-white font-semibold rounded-xl hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/40 transition-all">
                        {% trans "Yes, log out" %}
                    </button>
                    <a href="{% url 'home' %}"
                       class="block w-full py-3 px-4 bg-scifi-surface border border-scifi-border text-gray-300 font-semibold rounded-xl hover:bg-scifi-border text-center transition-all">
                        {% trans "Cancel" %}
                    </a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
